name: PPF CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Run Pester Tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PowerShell modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Display environment
        shell: pwsh
        run: |
          $PSVersionTable
          Get-Module Pester -ListAvailable | Sort-Object Version -Descending | Select-Object -First 1

      - name: Run Pester
        shell: pwsh
        run: |

          Import-Module Pester -MinimumVersion 5.0 -Force
          Import-Module "$PWD/src/PablitusPrompt.psm1" -Force

          Write-Host ""
          Write-Host "Loaded modules:"
          Get-Module Pester
          Get-Module PablitusPrompt

          $config = New-PesterConfiguration

          $config.Run.Path = "$PWD/tests"
          $config.Run.Exit = $true

          $config.Output.Verbosity = "Detailed"

          Invoke-Pester -Configuration $config