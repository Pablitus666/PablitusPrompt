name: PPF CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Pester 5
        shell: pwsh
        run: |
          Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0 -Force

          Import-Module "$PWD/src/PablitusPrompt.psm1" -Force

          Get-Module Pester
          Get-Module PablitusPrompt

          Invoke-Pester `
            -Path "$PWD/tests/Prompt.Tests.ps1" `
            -Output Detailed `
            -EnableExit